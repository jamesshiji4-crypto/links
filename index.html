<title>Shiji James · Links</title>
<meta name="description" content="All my links in one place.">
<style>
  :root {
    --bg: #fde4ee;
    --card: #ffffff;
    --text: #4a1530;
    --muted: #9b4f72;
    --accent: #e8508c;
    --border: #f6c3d8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2a0f1c;
      --card: #3a1627;
      --text: #ffe3ef;
      --muted: #e29bbd;
      --accent: #ff7aad;
      --border: #57223b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg) linear-gradient(180deg, #f9b8d2 0%, var(--bg) 320px) no-repeat;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .avatar {
    display: block;
    width: 112px; height: 112px; border-radius: 50%;
    margin: 0 auto 16px;
    object-fit: cover;
    border: 4px solid var(--card);
    box-shadow: 0 0 0 3px var(--accent);
  }
  @media (prefers-color-scheme: dark) {
    body { background: var(--bg) linear-gradient(180deg, #5a1d38 0%, var(--bg) 320px) no-repeat; }
  }
  h1 { font-size: 22px; font-weight: 700; }
  .slogan { color: var(--accent); font-size: 14px; font-style: italic; margin-top: 4px; }
  .tagline { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  .links a {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text); text-decoration: none;
    font-size: 16px; font-weight: 600;
    transition: transform .12s ease, border-color .12s ease;
  }
  .links a:hover { transform: translateY(-2px); border-color: var(--accent); }
  .links svg { color: var(--accent); }
  .links a:active { transform: scale(.98); }
  .links svg { width: 22px; height: 22px; flex-shrink: 0; fill: currentColor; }
  .links span { flex: 1; text-align: center; margin-right: 36px; }
  .section { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-top: 12px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: var(--accent); }
  .bg svg { position: absolute; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .28; }
  .bg svg.f { fill: currentColor; stroke: none; }
  .bg .path { opacity: .35; stroke-width: 1.4; stroke-dasharray: 4 6; }
  main { position: relative; z-index: 1; }
  @media (prefers-color-scheme: dark) { .bg svg { opacity: .32; } }
  @media (min-width: 700px) { .bg svg:not(.path) { transform: scale(1.4) rotate(var(--r, 0deg)); } }
</style>
</head>
